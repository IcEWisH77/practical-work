<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор</title>
<style>
  body {
    margin: 0; height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    font-family: Arial, sans-serif;
  }
  .calc {
    background: rgba(255,255,255,.1); padding: 30px;
    border-radius: 20px; backdrop-filter: blur(10px);
  }
  input {
    width: 100%; padding: 10px; margin-bottom: 10px;
    font-size: 18px; border: none; border-radius: 5px;
    box-sizing: border-box;
  }
  .buttons {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin: 15px 0;
  }
  button {
    padding: 12px; font-size: 16px; border: none; border-radius: 5px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; cursor: pointer;
  }
  button:hover { opacity: .9; }
  #result {
    background: white; padding: 15px; border-radius: 5px;
    font-size: 24px; text-align: center; min-height: 30px;
  }
</style>
</head>
<body>
  <div class="calc">
    <input type="text" id="num1" placeholder="Первое число">
    <input type="text" id="num2" placeholder="Второе число">
    <div class="buttons">
      <button data-op="sum">Сумма</button>
      <button data-op="diff">Разность</button>
      <button data-op="mul">Произведение</button>
      <button data-op="div">Деление</button>
    </div>
    <div id="result">Результат</div>
  </div>

<script>
  const num1 = document.getElementById('num1');
  const num2 = document.getElementById('num2');
  const resultEl = document.getElementById('result');

  function getNumbers() {
    const a = parseFloat(num1.value);
    const b = parseFloat(num2.value);
    if (isNaN(a) || isNaN(b)) throw new Error('Введите числа!');
    return [a, b];
  }

  const ops = {
    sum:  (a, b) => a + b,
    diff: (a, b) => a - b,
    mul:  (a, b) => a * b,
    div:  (a, b) => {
      if (b === 0) throw new Error('Деление на ноль!');
      return a / b;
    },
  };

  document.querySelectorAll('button[data-op]').forEach(btn => {
    btn.addEventListener('click', () => {
      try {
        const [a, b] = getNumbers();
        resultEl.textContent = ops[btn.dataset.op](a, b);
      } catch (e) {
        resultEl.textContent = 'Ошибка: ' + e.message;
      }
    });
  });
</script>
</body>
</html>
